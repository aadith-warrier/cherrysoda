name: proofwriter_depth3
source: "allenai_download"           # not on HF Hub — official AllenAI direct download
download_page: "https://allenai.org/data/proofwriter"
raw_data_path: "data/raw/proofwriter/"  # path after manual download + unzip (see scripts/download_data.sh comment)
depth: 3                             # fixed choice per project plan — decided in prelim setup, don't change without team discussion
loader: proofwriter

prelim_sample_size: 100
full_sample_size: null

prompt_template: |
  Given the following facts and rules, determine whether the hypothesis is True, False, or Unknown.
  Explain your reasoning step by step, stating each inference explicitly
  (e.g., "Since X and Rule2, we can conclude Y").

  Theory: {theory}
  Hypothesis: {hypothesis}

  Reasoning:
