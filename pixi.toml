[workspace]
authors = ["Aadith <warrieraadith@gmail.com>"]
channels = ["conda-forge"]
name = "cherrysoda"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
test = "python -m pytest tests"

[dependencies]
python = ">=3.10,<3.11"

[pypi-dependencies]
numpy = ">=2"
torch = { version = "==2.8.0", index = "https://download.pytorch.org/whl/cu128" }
# <5: LLaDA's remote model code fails to load on transformers 5.x
# ('LLaDAModelLM' object has no attribute 'all_tied_weights_keys'). >=4.56 for the `dtype=` argument.
transformers = ">=4.56,<5"
accelerate = ">=0.33.0"
sentencepiece = "*"
protobuf = "*"
datasets = ">=2.20.0"
pandas = "*"
pyyaml = "*"
omegaconf = "*"
networkx = "*"
sympy = "*"
scikit-learn = "*"
wandb = "*"
jsonlines = "*"
pytest = "*"

tqdm = "*"
hydra-core = "*"
huggingface_hub = "*"
lightning = ">=2.6.1, <3"
loguru = ">=0.7.3, <0.8"
