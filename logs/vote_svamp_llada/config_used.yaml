run:
  run_id: vote_svamp_llada
  model_config: configs/model/llada_8b.yaml
  dataset_config: configs/dataset/svamp.yaml
  baseline: temporal_vote
  sample_size: full
  seed: 42
  generation_overrides:
    vote_weighting: exp
    vote_alpha: 5.0
  logging:
    save_generations: true
    save_intermediate_states: false
    wandb_project: cherrysoda
    wandb_run_name: null
model:
  name: llada_8b
  wrapper: llada
  hf_repo_id: GSAI-ML/LLaDA-8B-Instruct
  dtype: bfloat16
  device: cuda:1
  mask_token_id: 126336
  generation:
    max_new_tokens: 256
    num_denoising_steps: 256
    block_length: 32
    temperature: 0.0
    remasking_strategy: low_confidence
    defer_eos_eot: false
    vote_weighting: exp
    vote_alpha: 5.0
  supports_intermediate_states: true
dataset:
  name: svamp
  source: github
  github_repo: https://github.com/arkilpatel/SVAMP.git
  raw_json_path: data/raw/SVAMP/SVAMP.json
  loader: svamp
  answer_type: numeric
  prelim_sample_size: 100
  full_sample_size: null
  prompt_template: 'Solve the following math word problem step by step.

    Show each calculation explicitly (e.g., "5 + 3 = 8").

    At the end, write the final answer on its own line in the form "The answer is:
    <number>".


    Problem: {question}


    Solution:

    '
