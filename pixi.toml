[workspace]
authors = ["Aadith <warrieraadith@gmail.com>"]
channels = ["conda-forge"]
name = "cherrysoda"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = ">=3.10,<3.11"

[pypi-dependencies]
numpy = ">=2"
torch = "==2.8.0"

tqdm = "*"
hydra-core = "*"
huggingface_hub = "*"
lightning = ">=2.6.1, <3"
loguru = ">=0.7.3, <0.8"

[pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/cu128"]
