run:
  run_id: proseco_proofwriter_d3
  model_config: configs/model/proseco_llada_sft.yaml
  dataset_config: configs/dataset/proofwriter_depth3.yaml
  baseline: vanilla
  sample_size: full
  seed: 42
  generation_overrides: {}
  logging:
    save_generations: true
    save_intermediate_states: false
    wandb_project: cherrysoda
    wandb_run_name: null
model:
  name: proseco_llada_sft
  wrapper: proseco
  hf_repo_id: kuleshov-group/proseco-llada-sft
  tokenizer_repo_id: GSAI-ML/LLaDA-8B-Instruct
  dtype: bfloat16
  device: cuda:1
  mask_token_id: 126336
  generation:
    max_new_tokens: 256
    num_denoising_steps: 256
    block_length: 32
    temperature: 0.0
    remasking_strategy: low_confidence
    apply_corrector_every_n_steps: 2
    max_corrector_steps_per_loop: 4
    early_eos_stopping: true
dataset:
  name: proofwriter_depth3
  source: allenai_download
  download_page: https://allenai.org/data/proofwriter
  raw_data_path: data/raw/proofwriter/
  world: OWA
  depth: 3
  split: test
  loader: proofwriter
  answer_type: label
  sample_seed: 1234
  prelim_sample_size: 100
  full_sample_size: 600
  prompt_template: 'Given the following facts and rules, determine whether the hypothesis
    is True, False, or Unknown.

    - True: the hypothesis can be proved from the facts and rules.

    - False: the negation of the hypothesis can be proved from the facts and rules.

    - Unknown: neither the hypothesis nor its negation can be proved.

    Explain your reasoning step by step, stating each inference explicitly

    (e.g., "Since Bob is red and all red things are rough, Bob is rough").

    At the end, write the final answer on its own line in the form "The answer is:
    True", "The answer is: False", or "The answer is: Unknown".


    Theory: {theory}

    Hypothesis: {hypothesis}


    Reasoning:

    '
