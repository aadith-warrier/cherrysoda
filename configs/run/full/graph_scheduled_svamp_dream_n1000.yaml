run_id: "graph_scheduled_svamp_dream_n1000"

method: remask
model_config: "configs/model/dream_7b.yaml"
dataset_config: "configs/dataset/svamp.yaml"
sample_size: full           # the whole test set (1,000)
seed: 42

generation:
  max_new_tokens: 256
  num_denoising_steps: 256
  block_length: null

verifier:
  name: graph_arithmetic
  check_grounding: true

remask:
  mode: graph
  schedule: true
  tokens_per_unit: 1
  max_rounds: 3
  steps_per_round: null
  temperature: null

draft_cache: "logs/draft_cache"
