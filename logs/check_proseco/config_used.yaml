run:
  run_id: check_proseco
  model_config: configs/model/proseco_llada_sft.yaml
  dataset_config: configs/dataset/gsm8k.yaml
  baseline: vanilla
  sample_size: 100
  seed: 42
  generation_overrides: {}
  logging:
    save_generations: true
    save_intermediate_states: false
    wandb_project: cherrysoda
    wandb_run_name: null
model:
  name: proseco_llada_sft
  wrapper: proseco
  hf_repo_id: kuleshov-group/proseco-llada-sft
  tokenizer_repo_id: GSAI-ML/LLaDA-8B-Instruct
  dtype: bfloat16
  device: cuda:1
  mask_token_id: 126336
  generation:
    max_new_tokens: 256
    num_denoising_steps: 256
    block_length: 32
    temperature: 0.0
    remasking_strategy: low_confidence
    apply_corrector_every_n_steps: 2
    max_corrector_steps_per_loop: 4
    early_eos_stopping: true
dataset:
  name: gsm8k
  hf_repo_id: openai/gsm8k
  hf_subset: main
  split: test
  loader: gsm8k
  answer_type: numeric
  prelim_sample_size: 100
  full_sample_size: null
  prompt_template: 'Solve the following grade school math problem step by step.

    Show each calculation explicitly (e.g., "5 + 3 = 8").

    At the end, write the final answer on its own line in the form "The answer is:
    <number>".


    Problem: {question}


    Solution:

    '
